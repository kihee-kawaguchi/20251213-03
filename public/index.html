            <button class="mobile-menu-toggle" aria-label="Toggle Menu">
                <span></span>

            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="#top">top</a></li>

                <button class="carousel-btn prev" aria-label="Previous">‹</button>

                        <div class="carousel-slide">
                            <img src="https://images.squarespace-cdn.com/content/v1/68bed9ac06f9876d2df0d7a9/eea8436d-a577-44f5-a9c8-f0bc152abd6b/21.png?format=1500w" alt="Gallery Image 21" loading="lazy">

                        </div>
                        <div class="carousel-slide">

                        <div class="carousel-slide">

                <form class="signup-form" id="signupForm">
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="メールアドレス" required class="email-input">
                        <button type="submit" class="submit-btn">サインアップ</button>
